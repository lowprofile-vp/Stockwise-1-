# Render Blueprint: New → Blueprint → pick this repository.
# Render does not read the Procfile, so the start command is declared here.
services:
  - type: web
    name: stockwise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 run:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: RETURN_RESET_TOKEN
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Your Vercel URL, e.g. https://stockwise.vercel.app (no trailing slash).
      # Add https://*.vercel.app to also allow preview deployments.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
